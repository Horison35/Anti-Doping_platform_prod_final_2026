# frontend/nginx.conf — статика SPA + проксирование /api на контейнер api.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Куки сессии (adp_session) идут как обычные заголовки — ничего
        # дополнительно передавать не нужно, proxy_pass это делает по умолчанию.
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: маршруты вида /analytics, /о-системе и т.д. рендерит
    # React Router на клиенте — Nginx всегда отдаёт index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
