<svg width="680" viewBox="0 0 680 760" xmlns="http://www.w3.org/2000/svg">
<title>Финальная архитектура антидопинговой платформы</title>
<style>
  text{font-family:Inter,'Segoe UI',Arial,sans-serif}
  .th{font-size:14px;font-weight:500;fill:#0F2D52}
  .ts{font-size:12px;fill:#7C8DA6}
  .arr{stroke:#B4B2A9;stroke-width:1.5;fill:none}
  .c-gray rect{fill:#F1EFE8;stroke:#B4B2A9}
  .c-purple rect{fill:#EEEDFE;stroke:#7F77DD}
  .c-teal rect{fill:#E1F5EE;stroke:#1D9E75}
  .c-coral rect{fill:#FAECE7;stroke:#F0997B}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#B4B2A9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="680" height="760" fill="#FFFFFF"/>

<g class="c-gray"><rect x="250" y="40" width="180" height="44" rx="8"/>
  <text class="th" x="340" y="66" text-anchor="middle">Cron · оркестратор</text></g>

<path d="M340 84 L340 100 L140 100 L140 112" class="arr" marker-end="url(#arrow)"/>
<path d="M340 84 L340 100 L540 100 L540 112" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="84" x2="340" y2="112" class="arr" marker-end="url(#arrow)"/>

<g class="c-teal"><rect x="50" y="116" width="180" height="56" rx="8"/>
  <text class="th" x="140" y="139" text-anchor="middle">Watcher рейтингов</text>
  <text class="ts" x="140" y="159" text-anchor="middle">еженедельно · PDF + xlsx</text></g>
<g class="c-gray"><rect x="250" y="116" width="180" height="56" rx="8"/>
  <text class="th" x="340" y="139" text-anchor="middle">База дисквалификаций</text>
  <text class="ts" x="340" y="159" text-anchor="middle">российских спортсменов</text></g>
<g class="c-purple"><rect x="450" y="116" width="180" height="56" rx="8"/>
  <text class="th" x="540" y="139" text-anchor="middle">АД-Монитор</text>
  <text class="ts" x="540" y="159" text-anchor="middle">Claude API · ежедневно</text></g>

<path d="M140 172 L140 196 L310 196 L310 212" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="172" x2="340" y2="212" class="arr" marker-end="url(#arrow)"/>
<path d="M540 172 L540 196 L370 196 L370 212" class="arr" marker-end="url(#arrow)"/>

<g class="c-teal"><rect x="240" y="216" width="200" height="56" rx="8"/>
  <text class="th" x="340" y="239" text-anchor="middle">Верификация и дедуп</text>
  <text class="ts" x="340" y="259" text-anchor="middle">код · инварианты · аудит</text></g>

<line x1="340" y1="272" x2="340" y2="308" class="arr" marker-end="url(#arrow)"/>

<g class="c-gray"><rect x="240" y="312" width="200" height="56" rx="8"/>
  <text class="th" x="340" y="335" text-anchor="middle">PostgreSQL</text>
  <text class="ts" x="340" y="355" text-anchor="middle">снапшоты · критерии · роли</text></g>

<path d="M340 368 L340 384 L220 384 L220 404" class="arr" marker-end="url(#arrow)"/>
<path d="M340 368 L340 384 L455 384 L455 404" class="arr" marker-end="url(#arrow)"/>

<g class="c-teal"><rect x="125" y="408" width="190" height="56" rx="8"/>
  <text class="th" x="220" y="431" text-anchor="middle">ML-прогон</text>
  <text class="ts" x="220" y="451" text-anchor="middle">CatBoost · model_risks.csv</text></g>
<g class="c-teal"><rect x="355" y="408" width="200" height="56" rx="8"/>
  <text class="th" x="455" y="431" text-anchor="middle">SIAR v2</text>
  <text class="ts" x="455" y="451" text-anchor="middle">зоны + дополнение + флаги</text></g>

<line x1="315" y1="436" x2="351" y2="436" class="arr" marker-end="url(#arrow)"/>

<text class="ts" x="605" y="300" text-anchor="end">неподтверждённое → флаг</text>
<path d="M615 172 L615 436 L559 436" fill="none" stroke="#7F77DD" stroke-width="1" stroke-dasharray="5 4" marker-end="url(#arrow)"/>

<path d="M455 464 L455 484 L340 484 L340 500" class="arr" marker-end="url(#arrow)"/>

<g class="c-teal"><rect x="240" y="504" width="200" height="56" rx="8"/>
  <text class="th" x="340" y="527" text-anchor="middle">FastAPI</text>
  <text class="ts" x="340" y="547" text-anchor="middle">dashboard.v1 · экспорт</text></g>

<path d="M340 560 L340 580 L220 580 L220 596" class="arr" marker-end="url(#arrow)"/>
<path d="M340 560 L340 580 L455 580 L455 596" class="arr" marker-end="url(#arrow)"/>

<g class="c-coral"><rect x="125" y="600" width="190" height="56" rx="8"/>
  <text class="th" x="220" y="623" text-anchor="middle">Веб-платформа</text>
  <text class="ts" x="220" y="643" text-anchor="middle">React · Plotly.js · Справка</text></g>
<g class="c-coral"><rect x="355" y="600" width="200" height="56" rx="8"/>
  <text class="th" x="455" y="623" text-anchor="middle">Отчёты и дайджест</text>
  <text class="ts" x="455" y="643" text-anchor="middle">Excel · Plotly · LLM-резюме</text></g>

<text class="ts" x="340" y="692" text-anchor="middle">↻ выводы отчётов → feedback_priorities следующего прогона</text>
<text class="ts" x="340" y="722" text-anchor="middle">внешних агентов в контуре нет · модель ранжирует, код формулирует, LLM собирает и резюмирует</text>
</svg>
